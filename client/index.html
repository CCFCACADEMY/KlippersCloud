<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#111113" />
    <meta name="description" content="Klippers — book your next haircut with top barbers. Online booking, loyalty rewards and more." />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700;800&display=swap" rel="stylesheet" />
    <title>Klippers — Barber Shop & Appointments</title>
    <script>
      // Apply saved theme before paint to avoid a flash
      try { const t = localStorage.getItem('klippers-theme'); if (t === 'light') document.documentElement.classList.remove('dark'); } catch {}
    </script>
  </head>
  <body class="bg-cream text-ink-900 dark:bg-ink-950 dark:text-white antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
