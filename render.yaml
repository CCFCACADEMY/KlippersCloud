# Render Blueprint — one click deploys a PostgreSQL database + the Klippers app.
# Dashboard → New → Blueprint → pick this repo (or use the "Deploy to Render" button in README).
databases:
  - name: klippers-db
    plan: free            # free Postgres expires after 30 days — upgrade to "basic-256mb" for anything real
    databaseName: klippers
    user: klippers

services:
  - type: web
    name: klippers
    runtime: docker
    plan: free            # free instances sleep after ~15 min idle (first request then takes ~1 min)
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase: { name: klippers-db, property: connectionString }
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: SEED_ON_EMPTY        # DEMO MODE: loads demo data when empty AND re-seeds when the demo data version changes. Set false for a real shop!
        value: "true"
      # CLIENT_URL defaults to Render's public URL (RENDER_EXTERNAL_URL). Set it if you add a custom domain.
      # Optional integrations — fill in from the Render dashboard when ready:
      - { key: STRIPE_SECRET_KEY, sync: false }
      - { key: STRIPE_WEBHOOK_SECRET, sync: false }
      - { key: SMTP_HOST, sync: false }
      - { key: SMTP_USER, sync: false }
      - { key: SMTP_PASS, sync: false }
      - { key: TWILIO_ACCOUNT_SID, sync: false }
      - { key: TWILIO_AUTH_TOKEN, sync: false }
      - { key: TWILIO_FROM_NUMBER, sync: false }
      - { key: ANTHROPIC_API_KEY, sync: false }
      - { key: GOOGLE_CLIENT_ID, sync: false }
